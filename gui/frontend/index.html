<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Bob</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/html_widgets.css">
<!-- Three.js för 3D/hologram-rendering. Byt gärna till lokala kopior i
     /frontend/vendor/ om Nils vill köra helt offline. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas"></div>

  <!-- Permanent chatt-input. Göms automatiskt när Voice Mode är på. -->
  <div id="chat-bar">
    <input id="chat-input" type="text" placeholder="Skriv till Bob..." autocomplete="off">
    <button id="chat-send">Skicka</button>
  </div>

  <!-- Röst-cirkel. Syns bara när Voice Mode är på. -->
  <div id="voice-circle" class="hidden">
    <div id="voice-circle-ring"></div>
    <div id="voice-circle-core"></div>
    <div id="voice-circle-label">lyssnar...</div>
  </div>

  <!-- Alltid synlig flik för att döma/visa live-svarswidgeten. Ligger
       UTANFÖR #stream-panel med flit: när panelen är gömd (visible=false)
       får man annars ingen väg tillbaka in, eftersom kugghjulet också
       gömdes med resten av panelen. -->
  <button id="stream-toggle-tab" title="Visa/göm live-panel">◈ live</button>

  <!-- Live-svarswidget: visar textström, resonemang, tool calls, interrupts. -->
  <div id="stream-panel">
    <div id="stream-header">
      <span>BOB — live</span>
      <div id="stream-header-buttons">
        <button id="stream-settings-btn" title="Inställningar">⚙</button>
        <button id="stream-hide-btn" title="Göm helt (Ctrl+Shift+L för att ta fram igen)">✕</button>
      </div>
    </div>
    <div id="stream-settings">
      <label><input type="checkbox" id="show-text" checked> Text</label>
      <label><input type="checkbox" id="show-reasoning" checked> Resonemang</label>
      <label><input type="checkbox" id="show-tool_call_chunk" checked> Tool calls</label>
      <label><input type="checkbox" id="show-interrupt" checked> Interrupts</label>
      <div id="stream-window-filter">
        <label><input type="checkbox" id="show-all-windows" checked> Alla fönster</label>
        <div id="stream-window-list"></div>
      </div>
      <button id="stream-clear-btn">Rensa</button>
    </div>
    <div id="stream-body"></div>
    <div id="stream-resize-handle" title="Dra för att ändra storlek"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
